name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*

  bioimageio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev,bioimageio]" bioimageio.core==0.11.0 numpy==1.26.4 tifffile==2024.8.30
      - run: python -m pip check
      - run: python -m pytest -q tests/test_validation_official.py
        env:
          NIDAVELLIR_TEST_BIOIMAGEIO: "1"
